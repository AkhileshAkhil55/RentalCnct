spring.application.name=RentalCnct

# H2 Database Connection Settings
spring.datasource.url=jdbc:h2:mem:rentalconnectdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 Console Settings
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA/Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Security Configurations
rentalconnect.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
# 24 hours expiration (in milliseconds)
rentalconnect.jwt.expiration=86400000

# CORS settings
rentalconnect.cors.allowed-origins=http://localhost:5173

# Server settings
server.port=8080

# Servlet upload limits (for uploading images)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
