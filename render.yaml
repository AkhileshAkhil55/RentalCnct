services:
  # Spring Boot Backend (Native Java Runtime - No Credit Card Required)
  - type: web
    name: rental-cnct-backend
    runtime: java
    rootDir: backend
    buildCommand: ./mvnw clean package -DskipTests
    startCommand: java -jar target/backend-0.0.1-SNAPSHOT.jar
    envVars:
      - key: PORT
        value: 8080

  # React Frontend Static Site (No Credit Card Required)
  - type: web
    name: rental-cnct-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://rental-cnct-backend.onrender.com
