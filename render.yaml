services:
  # Spring Boot Backend
  - type: web
    name: rental-cnct-backend
    env: docker
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    envVars:
      - key: PORT
        value: 8080

  # React Frontend Static Site
  - type: web
    name: rental-cnct-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://rental-cnct-backend.onrender.com
